name: skotiq_hub
description: >-
  Skotiq Constellation hub — a self-hostable, multi-tenant community service
  that fuses additive sky-atlas tile contributions from many imagers into shared
  deeper stacks. Pure Dart, runs anywhere a Dart runtime + libsqlite3 do.
version: 6.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"

# Runtime dependencies are deliberately small and all pure-Dart / FFI:
#   shelf + shelf_router   — the HTTP surface, mirroring headless_api_server.dart
#   sqlite3                — embedded DB via the system libsqlite3 (self-host parity)
#   crypto                 — SHA-256 server identity + token hashing (monorepo std)
#   pointycastle           — PBKDF2-HMAC-SHA256 password hashing (no native deps)
#   uuid                   — opaque account / contribution / claim ids
#   args                   — CLI flag parsing for bin/server.dart
#   path                   — cross-platform tile-store path joins
dependencies:
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  sqlite3: ^2.4.0
  crypto: ^3.0.0
  pointycastle: ^3.9.0
  uuid: ^4.0.0
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
