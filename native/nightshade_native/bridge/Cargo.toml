[package]
name = "nightshade_bridge"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
flutter_rust_bridge = "=2.11.1"
chrono.workspace = true
async-stream.workspace = true
base64.workspace = true
rayon = "1.10"

# Image encoding for thumbnails
image = { version = "0.24", default-features = false, features = ["jpeg"] }

# LRU cache for device ID parsing
lru = "0.18.2"

# Sync rwlock used for sequencer ExecutionContext slots that the bridge populates
# (matches `nightshade_sequencer`; see the executor's runtime-config docs).
parking_lot = "0.12"

# Internal crates
nightshade_sequencer = { path = "../sequencer" }
nightshade_imaging = { path = "../imaging" }
nightshade_alpaca = { path = "../alpaca" }
nightshade_native = { path = "../native" }
nightshade_indi = { path = "../indi" }

[target.'cfg(windows)'.dependencies]
nightshade_ascom = { path = "../ascom" }
windows.workspace = true

[target.'cfg(unix)'.dependencies]
# Link the system libusb dynamically. Vendoring libusb here would statically
# link LGPL-2.1 code into the bridge and create a relinking obligation for the
# distributed binary.
rusb = "0.9"

[dev-dependencies]
tempfile = "3.8"

# Why unconditional, when the real dependency above is Windows-only: the ASCOM
# connect read-back budget has to stay under this crate's own connect deadline
# (see the test in `timeout_ops`), and that relationship has to be checkable on
# the Linux workstation and in CI, where the Windows dependency does not exist.
# The non-Windows build of `nightshade_ascom` is just the platform-independent
# policy module, so this costs nothing.
nightshade_ascom = { path = "../ascom" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
