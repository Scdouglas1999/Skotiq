[package]
name = "skotiq_ascom"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Why: turning on `mock` activates `mockall::automock` on
# `AscomConnectionBackend` so `MockAscomConnectionBackend` is generated and
# re-exported. The integration test crate under `tests/` enables this feature
# via dev-dependencies below, while production builds (no feature) do not
# pull mockall in.
mock = ["dep:mockall"]

[dependencies]
tracing.workspace = true

# Why: optional so production builds skip it; activated by the `mock` feature.
mockall = { version = "0.13", optional = true }

# Windows-only dependencies
[target.'cfg(windows)'.dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
windows.workspace = true

# Why: tests under `tests/` are a separate crate; turning on the `mock`
# feature here makes `MockAscomConnectionBackend` reachable to them, and
# pulling in `mockall` directly gives the test crate access to predicates
# like `mockall::predicate::eq`.
[target.'cfg(windows)'.dev-dependencies]
skotiq_ascom = { path = ".", features = ["mock"] }
mockall = "0.13"

# Why: `implement` generates the `IDispatch_Impl` trait, which lets the tests
# stand a Rust object in for an ASCOM driver and drive the real COM path —
# including the `EXCEPINFO` a driver writes when it refuses a call. Declared as
# a dev-dependency so production builds never pull the proc-macro crates in.
windows = { workspace = true, features = ["implement"] }
