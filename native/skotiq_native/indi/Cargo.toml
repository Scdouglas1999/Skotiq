[package]
name = "skotiq_indi"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
skotiq_device = { path = "../device" }
skotiq_imaging = { path = "../imaging" }
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

# XML parsing for INDI protocol
quick-xml = { version = "0.31", features = ["async-tokio"] }
base64.workspace = true
# Frames a server sends zlib-compressed (`.fits.z`, `.bin.z`).
flate2 = "1.1"

# mDNS discovery
mdns-sd = "0.11"
if-addrs = "0.13"

# Per-instance PRNG for reconnect/restart jitter. fastrand 2.x is small,
# dependency-free, and lets us seed each IndiClient with a unique value so two
# clients started in the same wall-clock instant cannot produce correlated
# backoff schedules (would otherwise cause a thundering herd against the INDI
# server on simultaneous reconnect).
fastrand = "2"
