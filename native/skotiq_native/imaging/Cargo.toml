[package]
name = "skotiq_imaging"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
chrono.workspace = true
quick-xml.workspace = true

# Rayon for data parallelism
rayon = "1.10"

# Bytemuck for safe byte casting
bytemuck = { version = "1.14", features = ["derive"] }

# Deflate for compressed sky-atlas tile sidecars (already in the tree via png/zip)
flate2 = "1.1"

# XISF data block codecs and checksums (XISF 1.0 sections 10.5 and 10.6).
# LZ4 and Zstandard are the reference C libraries (BSD), bound by MIT/BSD
# crates; the hashes are RustCrypto (MIT OR Apache-2.0) on the digest 0.10
# line sha2 already uses in this workspace.
base64.workspace = true
lz4 = "1.28"
zstd = "0.13"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
# Hashes the decoded mosaic in tests/camera_raw.rs to compare with an independent decoder.
sha2 = "0.10"
