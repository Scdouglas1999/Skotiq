[package]
name = "skotiq_sequencer"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
image.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
base64.workspace = true
parking_lot = "0.12"
libc = "0.2"
skotiq_imaging = { path = "../imaging" }

[dev-dependencies]
# `test-util` is deliberately excluded from tokio's `full` feature, so the
# scenario simulation harness (executor/scenario_sim_tests.rs) enables it here
# to use `#[tokio::test(start_paused = true)]` — this lets the guide-star
# re-acquisition poll loop's 120s deadline elapse in virtual time rather than
# wall-clock, keeping the disconnect/recovery scenario tests fast. Test-only;
# no effect on the production build.
tokio = { workspace = true, features = ["test-util"] }
