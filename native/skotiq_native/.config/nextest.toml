# cargo-nextest, which scripts/rust_checks.sh test uses when it is installed
# (CI installs it). nextest runs each test in its own process; plain
# `cargo test` (the script's fallback and every targeted run) runs a binary's
# tests as threads of one process. Both are supported, so a test that touches
# a process global (the simulators, the device registry, the guiders, the
# event bus) still takes its lock, such as `sim_singleton_test_lock`.

[profile.default]
# Run every test, so one failure cannot hide the rest.
fail-fast = false
# Most tests wait on simulated rig clocks rather than use CPU, so twelve keeps
# a 4-core runner busy without starving the timing-sensitive tests.
test-threads = 12
slow-timeout = { period = "60s" }
