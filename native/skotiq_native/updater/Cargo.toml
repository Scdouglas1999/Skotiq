[package]
name = "skotiq_updater"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true
description = "Skotiq external updater - applies staged updates after app restart"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# ZIP extraction
zip = "0.6"

# Error handling
anyhow.workspace = true

# Serialization (expected-hashes manifest, operation log)
serde = { workspace = true }
serde_json.workspace = true

# Hashing for post-apply manifest verification
sha2 = "0.11"

# Cross-process file lock
fs2 = "0.4"

# File operations
walkdir = "2.4"
fs_extra = "1.3"

[dev-dependencies]
tempfile = "3.10"

# Process management + filesystem APIs (Windows-specific)
# Why: use workspace `windows` dep (0.52) + additive features to keep a single
# `windows-rs` semver across the workspace; otherwise cargo would resolve two
# copies if updater pinned its own version line.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
]}

# Build dependencies for embedding Windows manifest
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
