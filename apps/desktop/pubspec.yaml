name: skotiq_desktop
description: Skotiq Desktop - Cross-platform astrophotography suite
publish_to: 'none'
version: 8.1.4+34

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  skotiq_core:
    path: ../../packages/skotiq_core
  skotiq_ui:
    path: ../../packages/skotiq_ui
  skotiq_planetarium:
    path: ../../packages/skotiq_planetarium
  skotiq_bridge:
    path: ../../packages/skotiq_bridge
  skotiq_plugins:
    path: ../../packages/skotiq_plugins
  skotiq_remote_protocol:
    path: ../../packages/skotiq_remote_protocol
  skotiq_app:
    path: ../../packages/skotiq_app
  skotiq_updater:
    path: ../../packages/skotiq_updater

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Database — package:sqlite3 ^3 (via skotiq_core) ships SQLite through
  # Dart build hooks. Do not add sqlite3_flutter_libs: it embeds a second
  # un-namespaced libsqlite3 that clashes with GTK→tinysparql on modern Linux
  # and segfaults in sqlite3_initialize at startup.
  drift: ^2.30.0

  # Utilities
  flutter_hooks: ^0.20.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.2
  path: ^1.8.3
  package_info_plus: ^8.0.0
  ffi: ^2.1.0
  intl: ^0.20.2
  collection: ^1.18.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  uuid: ^4.3.3

  # Window management (desktop)
  window_manager: ^0.3.8

  # File selection
  file_selector: ^1.0.3

  # Icons
  lucide_icons: ^0.257.0

  # URL launcher
  url_launcher: ^6.2.4

  # Image processing
  image: ^4.1.7

  # QR code generation
  qr_flutter: ^4.1.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^2.4.0

  # mDNS service registration
  multicast_dns: ^0.3.2
  basic_utils: ^5.7.0
  pointycastle: ^3.9.1
  irondash_engine_context: 0.5.0

  # WebRTC datachannel transport for the live-view fan-out.
  # The headless server holds the answerer-side RTCPeerConnection per
  # session and ships each JPEG frame as a binary datachannel message.
  # On Windows desktop, flutter_webrtc bundles libwebrtc as a native DLL;
  # no UI surface is required because we only use the data-channel path.
  flutter_webrtc: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  # Upgraded from 3.0.2 to ^5.0.0.
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.0
  json_serializable: ^6.9.0
  drift_dev: ^2.33.0
  # Pinned to match the version already used across the workspace test suites
  # (e.g. skotiq_core). Test-only: lets the headless bootstrap tests mint an
  # `is FfiBackend` role double without dragging in the native backend.
  mocktail: ^1.0.4
  # Test-only: the transient handler tests stand in a fixed alert service, and
  # `TransientAlertService`'s constructor takes an `http.Client`. Pinned to the
  # version skotiq_core already resolves.
  http: ^1.2.0

flutter:
  uses-material-design: true

  # NOTE: bundled sample sequences for the Sequencer > Library tab live in
  # the skotiq_core package's own pubspec asset declaration. Flutter
  # automatically picks them up as `packages/skotiq_core/assets/...`
  # at runtime via rootBundle — they do NOT need to be re-declared here.

  assets:
    # Desktop control dashboard SPA, served from /dashboard. Listed FILE BY
    # FILE for the directory root rather than as `web_dashboard/`: a bare
    # directory entry copies everything sitting in it, which shipped
    # `web_dashboard/README.md` — 16KB of internal developer documentation of
    # the credential architecture — into every release bundle, where the
    # unauthenticated /dashboard prefix served it on request. The subdirectory
    # entries below stay as directories; `css/` and `js/` hold nothing but the
    # SPA's own assets. Developer material (README.md, test/, tools/) is not
    # part of the shipped product and must not be added here.
    - web_dashboard/index.html
    - web_dashboard/css/
    - web_dashboard/js/
    # phone/tablet Run-Watch SPA. Files are served from
    # /run-watch on the headless API server. Includes the PWA manifest,
    # service worker, and inlined SVG icons.
    - web_run_watch/
    - web_run_watch/css/
    - web_run_watch/js/
    - web_run_watch/icons/
    # Planetarium v2 — core + stars-hyg catalog packs (see assets/planetarium/catalogs/README.md).
    # Run build_opengnc / build_hyg_tiles before release builds so payloads exist beside pack.json.
    - assets/planetarium/catalogs/README.md
    - assets/planetarium/catalogs/core/
    - assets/planetarium/catalogs/stars-hyg-v1/pack.json
    - assets/planetarium/catalogs/stars-hyg-v1/tiles/
