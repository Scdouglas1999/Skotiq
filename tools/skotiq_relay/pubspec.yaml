name: skotiq_relay
description: >-
  Self-hostable Skotiq relay — appliances dial OUT to this server over a
  single WebSocket; phones connect through it from anywhere. Pure Dart, no
  Flutter, zero runtime dependencies beyond the SDK.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"

# Near-zero runtime dependencies: the relay, the mux protocol, the appliance
# uplink, and the phone-side tunnel client are all built on dart:io
# primitives (HttpServer / WebSocketTransformer / Socket). `crypto` (already
# used across the monorepo) is needed for SHA-256 hashing of registration
# secrets so the relay never stores them in plaintext.
dependencies:
  crypto: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
