name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # Nightly schedule runs heavier matrix jobs (Windows Rust) without blocking PRs.
  # 04:00 UTC ≈ 21:00 PT, after most US contributors stop pushing.
  schedule:
    - cron: '0 4 * * *'

jobs:
  rust-license-audit:
    name: Rust License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enforce allowed Rust licenses across all targets
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          arguments: --all-features
          manifest-path: native/skotiq_native/Cargo.toml

  constellation-hub:
    name: Constellation Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter (provides pinned Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Resolve hub dependencies
        working-directory: server/skotiq_hub
        run: dart pub get

      - name: Analyze hub
        working-directory: server/skotiq_hub
        run: dart analyze --fatal-infos

      - name: Test hub
        working-directory: server/skotiq_hub
        run: dart test

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      # regression-pin: --min-files asserts the auditor still walks the
      # whole runtime tree. Raise the baseline whenever a new top-level
      # package or native crate is added; never lower it without justifying
      # which runtime files were legitimately removed.
      # Baselines: placeholder=797 (current 839), behavioral=796 (current 838),
      # fail_closed=1337 (current 1408). Each is current * 0.95 floored, so
      # routine deletions do not break CI but a glob/exclude regression does.
      - name: Placeholder/Stub Audit Gate (fail on new vs baseline, direct)
        # Direct invocation with the --min-files regression-pin. Compares
        # against the triaged baseline (docs/production-readiness/
        # highrisk-baseline.txt) by path+content signature, so unrelated
        # line drift cannot trip the gate but any NEW high-risk marker does.
        # History: this step previously ran --fail-on-any-highrisk against a
        # line-scoped allowlist that was pruned from the public tree in
        # 3a25ef6e; the absolute-zero policy was aspirational (the triaged
        # baseline has ~160 reviewed entries, mostly fail-loud documentation
        # comments and audited Rust unwrap_or_default defaults) and the gate
        # had never passed. Baseline-compare is the enforced policy.
        run: dart run tools/production/placeholder_audit.dart --fail-on-new-highrisk --compare-highrisk-baseline docs/production-readiness/highrisk-baseline.txt --min-files 797

      - name: Placeholder/Stub Audit Gate (fail on new vs baseline)
        # melos script wraps `--fail-on-new-highrisk
        # --compare-highrisk-baseline docs/production-readiness/highrisk-baseline.txt`
        # so a regression against the recorded baseline trips CI even when
        # the absolute-zero policy above is later relaxed.
        run: melos run audit:placeholders

      - name: Fail-Closed Policy Gate (direct, with --min-files regression-pin)
        # required check. Direct invocation pins
        # --min-files 1337 so a scope regression (e.g., a glob change that
        # excludes a package) trips the gate even if no new violations land.
        run: dart run tools/production/fail_closed_check.dart --min-files 1337

      - name: Fail-Closed Policy Gate (melos wrapper)
        # required check. Belt-and-braces invocation via
        # melos so the documented developer-facing command
        # (`melos run audit:fail-closed`) is exercised on every PR. If the
        # two invocations diverge in flags, this step catches it.
        run: melos run audit:fail-closed

      - name: Behavioral Audit Gate
        run: dart run tools/production/behavioral_audit.dart --register docs/production-readiness/behavioral-audit-register.md --fail-on-unregistered --fail-on-open --report .behavioral_audit_hits.txt --min-files 796

      - name: Dependency Hygiene Gate
        run: dart run tools/production/dependency_hygiene.dart

      # BUILD-001: a released OTA package, the artifact filename, and the
      # binary-reported version must all denote the same release. This gate
      # fails closed when version.yaml, the desktop pubspec, and the mobile
      # pubspec disagree on version/build, or when the OTA package builder
      # stops deriving its version from version.yaml. The self-test validates
      # both the passing and failing paths.
      - name: Version Consistency Gate
        run: melos run audit:version-consistency

      - name: Version Consistency Audit Self-Test
        run: melos run audit:version-consistency:self-test

      - name: Analyze code (production gate)
        # required check. analyzer_rollup is the
        # `melos run analyze:production` zero-error gate (see melos.yaml).
        # Equivalent to `flutter analyze` per-package with a hard production
        # policy applied (docs/production-readiness/analyzer-policy.yaml).
        run: dart run tools/production/analyzer_rollup.dart --policy docs/production-readiness/analyzer-policy.yaml --critical-codes docs/production-readiness/critical-warning-codes.txt --report docs/production-readiness/analyzer-rollup.json

  launch-gate:
    name: Launch Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Launch Analyzer Gate (zero production warnings)
        run: dart run tools/production/analyzer_rollup.dart --policy docs/production-readiness/analyzer-policy.yaml --critical-codes docs/production-readiness/critical-warning-codes.txt --report docs/production-readiness/analyzer-rollup.json

      # regression-pin: keep --min-files in sync with the analyze job
      # above. If you raise one baseline, raise both.
      - name: Runtime Placeholder Gate
        run: dart run tools/production/placeholder_audit.dart --fail-on-new-highrisk --compare-highrisk-baseline docs/production-readiness/highrisk-baseline.txt --min-files 797

      - name: Runtime Behavioral Gate
        run: dart run tools/production/behavioral_audit.dart --register docs/production-readiness/behavioral-audit-register.md --fail-on-unregistered --fail-on-open --report .behavioral_audit_hits.txt --min-files 796

      # skotiq_core is the only Dart package that may import
      # package:skotiq_bridge. The audit fails closed (exit 1) on any
      # un-whitelisted importer; the self-test validates its exemption,
      # whitelist, and violation-detection logic.
      - name: Bridge Boundary Gate
        run: melos run audit:bridge-boundary

      - name: Bridge Boundary Audit Self-Test
        run: melos run audit:bridge-boundary:self-test

  test-dart:
    name: Dart Tests
    runs-on: ubuntu-latest
    # Raised from 20: the 6.0 suite grew past it and the job was being killed mid-run.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Run Dart tests
        run: melos run test

      - name: Verify v4.3.0 database migration to current schema
        working-directory: packages/skotiq_core
        env:
          SKOTIQ_OLD_DATABASE: ${{ github.workspace }}/packages/skotiq_core/test/fixtures/skotiq-v4.3.0-profile.db
        run: flutter test tool/production_migration_probe.dart --dart-define=REQUIRE_MIGRATION_ARTIFACT=true

  test-rust:
    # Linux Rust runs on every PR + push for fast feedback.
    name: Rust Tests (linux)
    runs-on: ubuntu-latest
    # The full suite includes timed autofocus and overnight-recovery scenarios.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux build dependencies
        # libudev-dev: serialport's libudev-sys build script needs the udev
        # headers + pkg-config entry on Linux (absent on ubuntu-latest).
        run: |
          sudo apt-get update -y
          # libraw-dev: the imaging crate links the system libraw (-lraw),
          # same as the release workflows already install.
          sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev libraw-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Run Rust tests
        working-directory: native/skotiq_native
        run: cargo test --locked --all-features --workspace

      - name: Run Rust clippy (workspace, deny warnings + high-value lints)
        working-directory: native/skotiq_native
        # High-value lint promotions (clippy debt):
        #   - result_unit_err: forbids `Result<(), ()>` (use a real error type)
        #   - await_holding_lock: catches the FFI deadlock pattern of
        #     locks held across `.await`.
        #   - undocumented_unsafe_blocks: every unsafe block must carry a
        #     specific `// SAFETY:` comment. Promoted from -W to -D after the
        #     residual sweep closed the last non-vendor hits. See
        #     docs/ci-gates.md.
        # We intentionally do NOT promote `clippy::pedantic` — too noisy
        # (7,140 warnings) and would block all PRs.
        run: cargo clippy --locked --all-features --workspace --all-targets -- -D warnings -D clippy::result_unit_err -D clippy::await_holding_lock -D clippy::undocumented_unsafe_blocks

  test-rust-windows:
    # Windows runs ONLY on:
    #   - push to main/master/develop
    #   - nightly schedule
    #   - PRs labeled `ci:windows-rust` (rare opt-in)
    # ASCOM only compiles on Windows; without this job `ascom/windows_impl.rs`
    # has zero CI exercise.
    # PR cycle time stays low because most PRs don't touch
    # ascom/ — the opt-in label is the escape hatch.
    name: Rust Tests (windows)
    runs-on: windows-2022
    timeout-minutes: 45
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows-rust'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Run Rust tests
        working-directory: native/skotiq_native
        # --workspace so the ascom/ crate (Windows-only) gets exercised here
        # in addition to the bridge/imaging/sequencer crates that already
        # build on Linux.
        run: cargo test --locked --all-features --workspace

      - name: Run Rust clippy (workspace, deny warnings + high-value lints)
        working-directory: native/skotiq_native
        # See the Linux job for the rationale on each `-D` lint. Windows is
        # especially important because the ascom/ crate is Windows-only and most of its
        # unsafe COM-calling lives there.
        run: cargo clippy --locked --all-features --workspace --all-targets -- -D warnings -D clippy::result_unit_err -D clippy::await_holding_lock -D clippy::undocumented_unsafe_blocks

  cargo-duplicates:
    # Keep the resolved multi-version dependency set reviewable. Existing
    # transitive duplicates are baselined; any graph drift must update the
    # baseline in the same change so it cannot become a permanent warning.
    name: Cargo Duplicate Versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Detect duplicate crate versions
        working-directory: native/skotiq_native
        run: |
          set -euo pipefail
          current="$(mktemp)"
          cargo metadata --locked --format-version 1 --all-features \
            | jq -r '.packages | sort_by(.name, .version) | group_by(.name)[] | select(map(.version) | unique | length > 1) | .[] | "\(.name) \(.version)"' \
            | sort -u > "$current"
          if ! diff -u duplicate-versions-baseline.txt "$current"; then
            echo "::error::The resolved duplicate-version set changed. Review the graph and update duplicate-versions-baseline.txt intentionally."
            exit 1
          fi
          echo "Duplicate-version baseline matches ($(wc -l < "$current") package-version entries)."

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Check Dart formatting
        run: melos run format -- --set-exit-if-changed

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: native/skotiq_native
        run: cargo fmt --all -- --check

  build-test:
    name: Build Test (Desktop)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        # windows pinned to windows-2022: windows-latest moved to
        # windows-2025-vs2026 (2026-06-18), whose CMake breaks flutter_webrtc's
        # Windows native build (extract-through-symlink). See release.yml.
        # Pin macOS while the macos-latest label migrates to macOS 26.
        os: [ubuntu-latest, windows-2022, macos-15]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          # Mirror linux-release-build.yml's package list:
          #   libudev-dev    — serialport's libudev-sys build script
          #   libraw-dev     — the imaging crate links the system libraw
          #   libsecret-1-dev / libjsoncpp-dev — flutter_secure_storage_linux
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libudev-dev libusb-1.0-0-dev libraw-dev libsecret-1-dev libjsoncpp-dev

      - name: Install macOS native dependencies
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          brew install libraw libusb
          libraw_prefix="$(brew --prefix libraw)"
          libusb_prefix="$(brew --prefix libusb)"
          echo "LIBRARY_PATH=$libraw_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=$libraw_prefix/include:$libusb_prefix/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$libraw_prefix/lib/pkgconfig:$libusb_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Build Rust library (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: native/skotiq_native
        run: cargo build --locked --release --manifest-path bridge/Cargo.toml

      - name: Build Rust library (Windows)
        if: matrix.os == 'windows-2022'
        working-directory: native/skotiq_native
        run: cargo build --locked --release --manifest-path bridge/Cargo.toml

      - name: Build Rust library (macOS)
        if: matrix.os == 'macos-15'
        working-directory: native/skotiq_native
        run: |
          # Try to build for the current architecture
          cargo build --locked --release --manifest-path bridge/Cargo.toml || true

      - name: Test build Flutter app
        working-directory: apps/desktop
        run: flutter build ${{ matrix.platform }} --debug

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Coverage re-runs the full instrumented test suite (it roughly duplicates
    # the Dart Tests job, which alone runs ~15 min), so it needs more headroom
    # than the uninstrumented jobs. 20 min was too tight and the job was
    # cancelled on timeout; 40 gives margin without masking a genuine hang.
    # Raised from 40: the 6.0 suite grew past it and the job was being killed mid-run.
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Install coverage tools
        run: dart pub global activate coverage

      - name: Run tests with coverage
        run: melos run test -- --coverage

      - name: Merge per-package coverage reports
        # `melos run test -- --coverage` writes coverage/lcov.info into EACH
        # package directory; the old step ran format_coverage against a
        # nonexistent repo-root coverage/ dir and the job had never passed.
        # flutter test --coverage already emits lcov, so no format step is
        # needed — just rebase each file's SF: paths from package-relative
        # to repo-relative and concatenate.
        run: |
          rm -f coverage.lcov
          found=0
          for f in packages/*/coverage/lcov.info apps/*/coverage/lcov.info; do
            [ -f "$f" ] || continue
            found=1
            pkg_dir=$(dirname "$(dirname "$f")")
            sed "s|^SF:|SF:$pkg_dir/|" "$f" >> coverage.lcov
          done
          if [ "$found" -eq 0 ]; then
            echo "No per-package lcov.info files found" >&2
            exit 1
          fi
          echo "Merged $(grep -c '^SF:' coverage.lcov) source-file records"

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov-coverage
          path: coverage.lcov

      - name: Upload coverage to Codecov
        # Best-effort until a CODECOV_TOKEN repo secret is provisioned
        # (none exists today, so a hard-fail here would keep CI red on a
        # missing credential rather than a code problem). The merged lcov
        # is always archived as a build artifact above; flip
        # fail_ci_if_error to true once the token is added.
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
