name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # Nightly schedule runs heavier matrix jobs (Windows Rust) without blocking PRs.
  # 04:00 UTC ≈ 21:00 PT, after most US contributors stop pushing.
  schedule:
    - cron: '0 4 * * *'

# Every check below is a stage of tools/production/gate.dart (`melos run gate`
# runs them all); the Rust jobs call scripts/rust_checks.sh, which the gate
# also runs. docs/ci-gates.md lists what each check enforces.
env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  rust-license-audit:
    name: Rust License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enforce allowed Rust licenses across all targets
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          arguments: --all-features
          manifest-path: native/skotiq_native/Cargo.toml

  constellation-hub:
    name: Constellation Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter (provides pinned Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Resolve, analyze and test the hub
        run: dart run tools/production/gate.dart --stage hub

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze gate
        # Token audit, release-script and catalog tests, dependency hygiene,
        # version consistency, the production analyzer gate and a whole-tree
        # dart analyze.
        run: melos run gate -- --stage analyze

  launch-gate:
    name: Launch Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      # The runtime audit gates and their self-tests. What they scan is
      # defined in docs/production-readiness/audit-scope.yaml; how to
      # reconcile them after moving or deleting code: docs/ci-gates.md.
      - name: Audit gates
        run: melos run gate -- --stage audits

  test-dart:
    name: Dart Tests
    runs-on: ubuntu-latest
    # The serialized 9.1 suite was still completing UI tests at 60 minutes
    # on a hosted runner. Leave time for the remaining packages, relay and
    # production migration probe on a slower runner.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Run Dart tests
        # Every flutter package (with a JSON record per package, so a failure
        # the console reporter does not attribute to a test can be named), the
        # pure Dart packages, and the v4.3.0 database migration to the current
        # schema. Each runs even when an earlier one failed.
        run: melos run gate -- --stage dart-tests

      - name: Name the failed Dart tests
        if: failure()
        # The console reporter hides a failed setUpAll, tearDownAll or file
        # load that has no error; this names every failed test in the JSON
        # records, hidden or not, and any test that never finished.
        run: |
          python3 scripts/test_name_failed_dart_tests.py
          python3 scripts/name_failed_dart_tests.py || true

      - name: Keep the Dart test records
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dart-test-results
          path: '**/test-results.json'
          retention-days: 14

  test-rust:
    # Linux Rust runs on every PR + push for fast feedback.
    name: Rust Tests (linux)
    runs-on: ubuntu-latest
    # The full suite includes timed autofocus and overnight-recovery scenarios,
    # and real-size image calibration and stacking.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux build dependencies
        # libudev-dev: serialport's libudev-sys build script needs the udev
        # headers + pkg-config entry on Linux (absent on ubuntu-latest).
        run: |
          sudo apt-get update -y
          # libraw-dev: the imaging crate links the system libraw (-lraw),
          # same as the release workflows already install.
          sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev libraw-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Run Rust clippy (workspace, deny warnings + high-value lints)
        run: bash scripts/rust_checks.sh clippy

      - name: Run Rust tests
        run: bash scripts/rust_checks.sh test

  test-rust-windows:
    # Windows runs on:
    #   - push to main/master/develop
    #   - nightly schedule
    #   - PRs from a release or fix branch (`release/*`, `fix/*`), which are
    #     the ones a release is cut after
    #   - PRs labeled `ci:windows-rust`
    # ASCOM only compiles on Windows; without this job `ascom/windows_impl.rs`
    # has zero CI exercise. Other PRs skip it to keep their cycle time low.
    name: Rust Tests (windows)
    runs-on: windows-2022
    timeout-minutes: 90
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && (
        startsWith(github.head_ref, 'release/') ||
        startsWith(github.head_ref, 'fix/') ||
        contains(github.event.pull_request.labels.*.name, 'ci:windows-rust')))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Run Rust clippy (workspace, deny warnings + high-value lints)
        # The ascom/ crate is Windows-only and holds most of the unsafe
        # COM-calling code.
        shell: bash
        run: bash scripts/rust_checks.sh clippy

      - name: Run Rust tests
        shell: bash
        run: bash scripts/rust_checks.sh test

  cargo-duplicates:
    # Keep the resolved multi-version dependency set reviewable. Existing
    # transitive duplicates are baselined; any graph drift must update the
    # baseline in the same change so it cannot become a permanent warning.
    name: Cargo Duplicate Versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Detect duplicate crate versions
        run: bash scripts/rust_checks.sh duplicates

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Check Dart and Rust formatting
        run: melos run gate -- --stage format

  build-test:
    name: Build Test (Desktop)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        # windows pinned to windows-2022: windows-latest moved to
        # windows-2025-vs2026 (2026-06-18), whose CMake breaks flutter_webrtc's
        # Windows native build (extract-through-symlink). See release.yml.
        # Pin macOS while the macos-latest label migrates to macOS 26.
        os: [ubuntu-latest, windows-2022, macos-15]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          # Mirror linux-release-build.yml's package list:
          #   libudev-dev    — serialport's libudev-sys build script
          #   libraw-dev     — the imaging crate links the system libraw
          #   libsecret-1-dev / libjsoncpp-dev — flutter_secure_storage_linux
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libudev-dev libusb-1.0-0-dev libraw-dev libsecret-1-dev libjsoncpp-dev

      - name: Install macOS native dependencies
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          brew install libraw libusb
          libraw_prefix="$(brew --prefix libraw)"
          libusb_prefix="$(brew --prefix libusb)"
          echo "LIBRARY_PATH=$libraw_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=$libraw_prefix/include:$libusb_prefix/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$libraw_prefix/lib/pkgconfig:$libusb_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Build Rust library (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: dart scripts/build.dart bridge

      - name: Build Rust library (Windows)
        if: matrix.os == 'windows-2022'
        run: dart scripts/build.dart bridge

      - name: Build Rust library (macOS)
        if: matrix.os == 'macos-15'
        run: |
          # Try to build for the current architecture
          dart scripts/build.dart bridge || true

      - name: Test build Flutter app
        run: dart scripts/build.dart flutter ${{ matrix.platform }} --debug

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Coverage instruments the same serialized workspace suite. Hosted runs
    # reached the old 75-minute limit before producing the merged report.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Install coverage tools
        run: dart pub global activate coverage

      - name: Run tests with coverage
        run: melos run test -- --coverage

      - name: Merge per-package coverage reports
        # `melos run test -- --coverage` writes coverage/lcov.info into EACH
        # package directory; the old step ran format_coverage against a
        # nonexistent repo-root coverage/ dir and the job had never passed.
        # flutter test --coverage already emits lcov, so no format step is
        # needed — just rebase each file's SF: paths from package-relative
        # to repo-relative and concatenate.
        run: |
          rm -f coverage.lcov
          found=0
          for f in packages/*/coverage/lcov.info apps/*/coverage/lcov.info tools/*/coverage/lcov.info; do
            [ -f "$f" ] || continue
            found=1
            pkg_dir=$(dirname "$(dirname "$f")")
            sed "s|^SF:|SF:$pkg_dir/|" "$f" >> coverage.lcov
          done
          if [ "$found" -eq 0 ]; then
            echo "No per-package lcov.info files found" >&2
            exit 1
          fi
          echo "Merged $(grep -c '^SF:' coverage.lcov) source-file records"

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov-coverage
          path: coverage.lcov

      - name: Upload coverage to Codecov
        # Best-effort until a CODECOV_TOKEN repo secret is provisioned
        # (none exists today, so a hard-fail here would keep CI red on a
        # missing credential rather than a code problem). The merged lcov
        # is always archived as a build artifact above; flip
        # fail_ci_if_error to true once the token is added.
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
