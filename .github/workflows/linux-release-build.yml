name: Linux Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-release-build.yml'
      - 'apps/desktop/**'
      - 'native/skotiq_native/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/production/linux_release_package_metadata.dart'
      - 'melos.yaml'

jobs:
  linux-release-build:
    name: Build Linux Release Artifact
    # ubuntu-22.04 ships glibc 2.35, under the 2.36 Bookworm/Raspberry Pi OS
    # floor the artifact targets — so binaries built here link symbols the
    # appliance can resolve. Building on ubuntu-latest (glibc 2.39) produces
    # binaries that abort on boot there (caught by the glibc-floor step below).
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libraw-dev \
            xvfb \
            tar

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Build Linux release bundle
        run: dart run melos run build:desktop:linux --no-select

      - name: Bundle native libs + verify the bridge is present
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE/lib"
          if [ ! -d "$BUNDLE_LIB" ]; then
            echo "Bundle lib dir not found: $BUNDLE_LIB" >&2
            exit 1
          fi
          # Fail loudly if the native bridge didn't make it into the bundle —
          # the melos build script runs `cargo build` then `flutter build` and
          # does NOT fail-fast if cargo fails, so a missing system dep would
          # otherwise silently produce a bundle that can't load its bridge.
          if [ ! -e "$BUNDLE_LIB/libskotiq_bridge.so" ]; then
            echo "libskotiq_bridge.so is MISSING from the bundle — the Rust build likely failed." >&2
            ls -l "$BUNDLE_LIB" >&2 || true
            exit 1
          fi
          # The bridge dynamically links libraw (-lraw); ship it in the bundle
          # (executable rpath = $ORIGIN/lib) so the release is self-contained.
          LIBRAW_PATH="$(ldconfig -p | awk '/libraw\.so/ {print $NF; exit}')"
          if [ -z "${LIBRAW_PATH:-}" ] || [ ! -e "$LIBRAW_PATH" ]; then
            echo "libraw shared object not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$LIBRAW_PATH" "$BUNDLE_LIB/"
          # package:sqlite3 ^3 installs a hermetic libsqlite3.so via Dart build
          # hooks (CMake copies build/native_assets/linux/ into bundle/lib).
          # That build is linked with -Bsymbolic so it can coexist with the
          # system libsqlite3 that GTK→tinysparql already loads on modern
          # Linux. Do NOT replace it with the host's libsqlite3 or a symlink —
          # that was the old sqlite3_flutter_libs packaging and it both
          # clobbers the native asset and reintroduces dual-SQLite crashes.
          # This MUST match release.yml (BUILD-002).
          if [ ! -f "$BUNDLE_LIB/libsqlite3.so" ] || [ -L "$BUNDLE_LIB/libsqlite3.so" ]; then
            echo "MISSING: hermetic native-asset $BUNDLE_LIB/libsqlite3.so (regular file)" >&2
            ls -l "$BUNDLE_LIB"/libsqlite3* >&2 || true
            exit 1
          fi
          # Launcher: prepend the bundled lib/ so libraw (and the hermetic
          # sqlite native asset) win the loader search. Written with printf
          # (not a heredoc) so YAML block-indentation can't corrupt it.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'HERE="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]:-$0}")")" && pwd)"'
            printf '%s\n' 'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            printf '%s\n' '# Frameless GTK window under native Wayland runs headless-invisible'
            printf '%s\n' '# (no surface ever shows); XWayland is the path every tested launch'
            printf '%s\n' '# used. Force it until the Wayland surface path is fixed and proven.'
            printf '%s\n' 'export GDK_BACKEND=x11'
            printf '%s\n' 'exec "$HERE/skotiq_desktop" "$@"'
          } > "$BUNDLE/skotiq"
          chmod +x "$BUNDLE/skotiq"
          echo "Bundle lib contents:"
          ls -l "$BUNDLE_LIB" "$BUNDLE/skotiq"

      - name: Verify runnable-bundle parity with release.yml (sqlite + launcher)
        run: |
          set -euo pipefail
          # BUILD-002 guard: this job's artifact must carry the SAME
          # cross-distro layout release.yml ships — hermetic hook-built
          # libsqlite3.so (regular file, not a host symlink) plus the
          # launcher wrapper. Fail loudly if anything diverges.
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE/lib"
          fail=0
          if [ ! -f "$BUNDLE_LIB/libsqlite3.so" ] || [ -L "$BUNDLE_LIB/libsqlite3.so" ]; then
            echo "MISSING: hermetic $BUNDLE_LIB/libsqlite3.so (package:sqlite3 native asset)" >&2; fail=1
          fi
          if [ -e "$BUNDLE_LIB/libsqlite3_flutter_libs_plugin.so" ]; then
            echo "UNEXPECTED: sqlite3_flutter_libs plugin still linked — remove the dependency" >&2; fail=1
          fi
          if [ ! -x "$BUNDLE/skotiq" ]; then
            echo "MISSING: $BUNDLE/skotiq launcher wrapper" >&2; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Linux release artifact diverges from release.yml — not a runnable cross-distro bundle (BUILD-002)." >&2
            exit 1
          fi
          echo "Runnable-bundle parity OK (hermetic sqlite + launcher present)."

      - name: Verify glibc floor (Bookworm / Raspberry Pi OS compatibility)
        run: |
          set -euo pipefail
          # This job builds on ubuntu-22.04 (glibc 2.35), below the appliance's
          # Debian/Raspberry Pi OS Bookworm glibc 2.36 floor. Keep this guard so
          # a future runner or prebuilt library cannot silently raise the floor.
          # The Docker path performs the same check on Bookworm:
          #   docker run --rm -e SKOTIQ_GLIBC_FLOOR=2.36 \
          #     -v "$PWD":/host:ro -v "$PWD/dist-linux":/out \
          #     debian:bookworm-slim bash /host/scripts/docker_build_linux.sh
          FLOOR="${SKOTIQ_GLIBC_FLOOR:-2.36}"
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          floor_major=${FLOOR%%.*}; floor_minor=${FLOOR#*.}
          violations=0
          for bin in "$BUNDLE"/skotiq_desktop "$BUNDLE"/lib/*.so; do
            [ -f "$bin" ] || continue
            maxv=$(objdump -T "$bin" 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1 || true)
            [ -n "$maxv" ] || continue
            v=${maxv#GLIBC_}; major=${v%%.*}; minor=${v#*.}
            if [ "$major" -gt "$floor_major" ] || \
               { [ "$major" -eq "$floor_major" ] && [ "$minor" -gt "$floor_minor" ]; }; then
              echo "VIOLATION: $(basename "$bin") needs $maxv (> $FLOOR)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations binary(ies) exceed glibc $FLOOR — this artifact will NOT boot on the Bookworm appliance. Build on Bookworm (see comment above)."
            exit 1
          fi
          echo "glibc floor OK (no binary exceeds $FLOOR)"

      - name: Add release licenses and notices
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          cp LICENSE "$BUNDLE/SKOTIQ-LICENSE.txt"
          cp docs/THIRD_PARTY_NOTICES.md "$BUNDLE/THIRD_PARTY_NOTICES.md"
          printf '%s\n' "$GITHUB_SHA" > "$BUNDLE/SOURCE-COMMIT.txt"
          mkdir -p "$BUNDLE/LICENSES"
          cp third_party/licenses/LGPL-2.1.txt "$BUNDLE/LICENSES/LGPL-2.1.txt"

      - name: Headless runtime smoke
        run: |
          set -euo pipefail
          mkdir -p build/release-linux
          # The Flutter Linux bundle initialises GTK even in the headless
          # smoke, so it needs a display. CI runners are headless — give it a
          # virtual framebuffer via xvfb so the smoke can actually launch.
          xvfb-run -a dart run tools/production/headless_lan_linux_smoke.dart \
            | tee build/release-linux/headless-runtime-smoke.log

      - name: Generate Linux package metadata
        run: |
          dart run tools/production/linux_release_package_metadata.dart \
            --bundle-dir=apps/desktop/build/linux/x64/release/bundle \
            --output-dir=build/release-linux \
            --artifact-name=skotiq-linux-x64-${{ github.sha }}.tar.gz \
            --metadata-output=docs/production-readiness/linux-release-package-metadata.json \
            --runtime-smoke-log=build/release-linux/headless-runtime-smoke.log \
            --runtime-smoke-passed \
            --write-evidence

      - name: Upload Linux release package
        uses: actions/upload-artifact@v7
        with:
          name: skotiq-linux-x64-${{ github.sha }}
          path: |
            build/release-linux/*.tar.gz
            build/release-linux/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux package metadata
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-package-metadata-${{ github.sha }}
          path: docs/production-readiness/linux-release-package-metadata.json
          if-no-files-found: error
          retention-days: 14
