name: Windows Release Build

# Produces a packaged Windows desktop build (zipped Release folder) as a
# downloadable artifact. Runs on Windows runners because Flutter desktop for
# Windows cannot be cross-compiled from Linux/macOS.
#
# Trigger on demand only (Actions tab or `gh workflow run
# windows-release-build.yml`). Windows release artifacts are produced when
# needed rather than on every push.
on:
  workflow_dispatch:

jobs:
  windows-release-build:
    name: Build Windows Release Artifact
    # windows-2022 (not windows-latest): the newer image's bundled CMake/bsdtar
    # mishandles archives that contain symlinks and breaks flutter_webrtc's
    # Windows native build ("Cannot extract through symlink ...flutter_webrtc").
    # Matches release.yml's Windows job. Revisit when a durable CMake/webrtc
    # workaround lands.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # The imaging crate's build.rs links libraw; point it at the vendored
      # import lib/DLL in the repo so the Rust build is self-contained on a
      # clean runner (no system libraw install).
      LIBRAW_DIR: ${{ github.workspace }}\lib\libraw

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Match the modernized toolchain (Dart 3.12 / analyzer 10). The repo's
          # codegen deps (freezed 3, drift 2.33, etc.) require Flutter 3.4x.
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/skotiq_native

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      # Run the three build phases as explicit steps rather than via
      # `melos run build:desktop:windows`: that script's multi-line `run:` block
      # only executes its first line (cargo) on the Windows shell, silently
      # skipping the flutter build + staging and producing no Release output.
      - name: Build Rust native bridge (release)
        run: cargo build --locked --release --manifest-path native/skotiq_native/bridge/Cargo.toml

      - name: Build Flutter Windows app (release)
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Stage native DLLs (bridge, libraw, MSVC runtime) into Release
        shell: pwsh
        run: ./scripts/stage_windows_release.ps1 -Profile Release

      - name: Verify the Release output is complete
        shell: pwsh
        run: |
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          $missing = @()
          foreach ($f in @("skotiq.exe", "skotiq_bridge.dll", "libraw.dll")) {
            if (-not (Test-Path (Join-Path $rel $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Release dir contents:"
            Get-ChildItem $rel | Format-Table Name, Length
            Write-Error "Missing required files in Release output: $($missing -join ', ')"
            exit 1
          }
          Write-Host "Release output verified:"
          Get-ChildItem $rel | Format-Table Name, Length

      - name: Package Release folder
        shell: pwsh
        run: |
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          Compress-Archive -Path "$rel/*" -DestinationPath "skotiq-windows-x64.zip" -Force
          (Get-FileHash "skotiq-windows-x64.zip" -Algorithm SHA256).Hash | Out-File "skotiq-windows-x64.zip.sha256"

      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: skotiq-windows-x64-${{ github.sha }}
          path: |
            skotiq-windows-x64.zip
            skotiq-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
