name: Release

# Builds the Android APK, Linux bundle, and Windows package, then publishes
# them all to a public GitHub Release. Triggered by pushing a version tag
# (e.g. `git tag v5.0.0 && git push origin v5.0.0`). Windows desktop cannot be
# cross-compiled from Linux, so it builds on a Windows runner here.
#
# `workflow_dispatch` lets you rebuild artifacts on demand. Supplying an
# existing draft `release_tag` attaches the rebuilt assets without publishing
# the draft; tag pushes retain the normal publish behavior.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag to attach artifacts to (leave blank to build only)'
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  # Single source of truth for the artifact version: the desktop pubspec. On a
  # tag push the tag must match (vX.Y.Z) or the build fails loudly, so published
  # file names can never drift from the tag — or the pubspec — again.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Resolve + validate version
        id: resolve
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          pubspec_version="$(grep '^version:' apps/desktop/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          # BUILD-001: the desktop pubspec is the artifact-version source of
          # truth, but the mobile pubspec and version.yaml (the OTA/Linux
          # packaging source) must denote the SAME release or the OTA manifest,
          # the Android APK, and the desktop binary could ship mismatched
          # versions under one tag. Fail loudly if they disagree.
          mobile_version="$(grep '^version:' apps/mobile/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          version_yaml="$(grep '^version:' version.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/[" ]//g; s/#.*$//')"
          if [ "$mobile_version" != "$pubspec_version" ]; then
            echo "::error::apps/mobile/pubspec.yaml (${mobile_version}) does not match apps/desktop/pubspec.yaml (${pubspec_version}). Reconcile all version sources to one release."
            exit 1
          fi
          if [ "$version_yaml" != "$pubspec_version" ]; then
            echo "::error::version.yaml (${version_yaml}) does not match apps/desktop/pubspec.yaml (${pubspec_version}). version.yaml feeds the OTA/Linux packaging version; reconcile all version sources to one release."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$pubspec_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (${tag_version}) does not match apps/desktop/pubspec.yaml (${pubspec_version}). Bump the pubspecs and the tag in lockstep."
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          elif [ -n "${REQUESTED_RELEASE_TAG:-}" ]; then
            tag_version="${REQUESTED_RELEASE_TAG#v}"
            if [ "$tag_version" != "$pubspec_version" ]; then
              echo "::error::Requested release ${REQUESTED_RELEASE_TAG} (${tag_version}) does not match apps/desktop/pubspec.yaml (${pubspec_version})."
              exit 1
            fi
            release_tag="$REQUESTED_RELEASE_TAG"
          else
            release_tag=""
          fi
          echo "app_version=${pubspec_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${pubspec_version}"

  # --------------------------------------------------------------------------
  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      # The app's `release` signing config falls back to the standard Android
      # debug keystore. A dev machine already has one (auto-generated on the
      # first build); a clean CI runner does not, and release-signing
      # validation runs before AGP would create it — so make it ourselves with
      # the canonical debug credentials at the locations AGP looks.
      - name: Ensure Android debug keystore exists
        run: |
          set -euo pipefail
          for dir in "$HOME/.android" "$HOME/.config/.android"; do
            ks="$dir/debug.keystore"
            if [ ! -f "$ks" ]; then
              mkdir -p "$dir"
              keytool -genkeypair -v \
                -keystore "$ks" \
                -storepass android -keypass android \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      # Decode the production upload keystore when provisioned. Absent secret ->
      # KEYSTORE_FILE stays unset and build.gradle.kts falls back to the debug
      # keystore staged above (debug-signed beta). A SET-but-broken keystore
      # fails the build in gradle rather than silently debug-signing a release.
      - name: Decode release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded: production signing enabled."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set: building debug-signed beta APKs."
          fi

      # The mobile app is a pure-Flutter companion (it talks to the desktop
      # server over HTTP/WS) — no Rust/NDK cross-compilation is required.
      # `--split-per-abi` emits one APK per ABI; gradle reads KEYSTORE_* from the
      # env (KEYSTORE_FILE is exported by the decode step above when present).
      - name: Build release APKs (per-ABI)
        working-directory: apps/mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The update public key is compiled in so the app can authenticate the
        # OTA manifests below. Without it every update download is refused,
        # whether or not the manifests are signed.
        run: flutter build apk --release --split-per-abi "--dart-define=NIGHTSHADE_UPDATE_PUBLIC_KEY=${{ secrets.NIGHTSHADE_UPDATE_PUBLIC_KEY }}"

      - name: Stage + checksum APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          apkdir="apps/mobile/build/app/outputs/flutter-apk"
          found=0
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="$apkdir/app-$abi-release.apk"
            [ -f "$src" ] || continue
            dest="nightshade-${APP_VERSION}-android-$abi.apk"
            cp "$src" "dist/$dest"
            (cd dist && sha256sum "$dest" > "$dest.sha256")
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No per-ABI release APKs found in $apkdir"
            ls -l "$apkdir" || true
            exit 1
          fi
          ls -l dist

      # One signed manifest per ABI, so an arm64 phone is never offered the
      # x86_64 build. The APK is its own package here — Android installs it
      # whole — so the manifest's downloadUrl is the APK's own release asset
      # URL. Empty NIGHTSHADE_UPDATE_PRIVATE_KEY -> unsigned manifests (OTA
      # stays fail-closed-disabled); the build still succeeds.
      - name: Sign OTA manifests (per ABI)
        env:
          NIGHTSHADE_UPDATE_PRIVATE_KEY: ${{ secrets.NIGHTSHADE_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(grep -oP 'build_number:\s*\K\d+' version.yaml)"
          # ABI -> the architecture name currentUpdateArchitecture() reports on
          # that device, which is what the app matches the manifest against.
          declare -A ARCH_FOR_ABI=(
            [armeabi-v7a]=arm
            [arm64-v8a]=arm64
            [x86_64]=x64
          )
          for abi in armeabi-v7a arm64-v8a x86_64; do
            asset="nightshade-${APP_VERSION}-android-$abi.apk"
            [ -f "$GITHUB_WORKSPACE/dist/$asset" ] || continue
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION}/${asset}"
            (cd packages/nightshade_updater && dart run tool/build_update_manifest.dart \
              --payload "$GITHUB_WORKSPACE/dist/$asset" \
              --out-dir "$GITHUB_WORKSPACE/dist" \
              --version "$APP_VERSION" \
              --build-number "$BUILD_NUMBER" \
              --platform android \
              --arch "${ARCH_FOR_ABI[$abi]}" \
              --download-url "$url")
          done
          ls -l dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  linux:
    name: Linux x64
    # Build on Jammy (glibc 2.35), NOT ubuntu-latest (24.04 / glibc 2.39). The
    # shipped appliance runs Debian/Raspberry Pi OS Bookworm (glibc 2.36); a
    # bundle built against a newer glibc aborts on boot there with
    # "GLIBC_2.38 not found". 2.35 < the 2.36 floor, and a 2.35-linked binary
    # runs on every newer glibc, so this satisfies the floor gate below while
    # keeping the host-native build (no Docker) and existing packaging intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nightshade_native

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev \
            libudev-dev libusb-1.0-0-dev libraw-dev tar

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      # Same two steps as `melos run build:desktop:linux`, spelled out so the
      # update public key can be compiled in. A build without it cannot
      # authenticate any OTA manifest, signed or not.
      - name: Build Linux release bundle
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/nightshade_native/bridge/Cargo.toml
          cd apps/desktop
          flutter build linux --release "--dart-define=NIGHTSHADE_UPDATE_PUBLIC_KEY=${{ secrets.NIGHTSHADE_UPDATE_PUBLIC_KEY }}"

      - name: Bundle native libs + verify the bridge is present
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          BUNDLE_LIB="$BUNDLE/lib"
          if [ ! -e "$BUNDLE_LIB/libnightshade_bridge.so" ]; then
            echo "libnightshade_bridge.so is MISSING — the Rust build likely failed." >&2
            ls -l "$BUNDLE_LIB" >&2 || true
            exit 1
          fi
          # The bridge dynamically links libraw; ship it so the release is
          # self-contained (bridge rpath = $ORIGIN).
          LIBRAW_PATH="$(ldconfig -p | awk '/libraw\.so/ {print $NF; exit}')"
          if [ -z "${LIBRAW_PATH:-}" ] || [ ! -e "$LIBRAW_PATH" ]; then
            echo "libraw shared object not found via ldconfig" >&2
            exit 1
          fi
          cp -Lv "$LIBRAW_PATH" "$BUNDLE_LIB/"
          # package:sqlite3 ^3 installs a hermetic libsqlite3.so via Dart build
          # hooks (CMake copies build/native_assets/linux/ into bundle/lib).
          # That build is linked with -Bsymbolic so it can coexist with the
          # system libsqlite3 that GTK→tinysparql already loads on modern
          # Linux. Do NOT replace it with the host's libsqlite3 or a symlink —
          # that was the old sqlite3_flutter_libs packaging and it both
          # clobbers the native asset and reintroduces dual-SQLite crashes.
          if [ ! -f "$BUNDLE_LIB/libsqlite3.so" ] || [ -L "$BUNDLE_LIB/libsqlite3.so" ]; then
            echo "MISSING: hermetic native-asset $BUNDLE_LIB/libsqlite3.so (regular file)" >&2
            ls -l "$BUNDLE_LIB"/libsqlite3* >&2 || true
            exit 1
          fi
          # Launcher: prepend the bundled lib/ so libraw (and the hermetic
          # sqlite native asset) win the loader search. Written with printf
          # (not a heredoc) so YAML block-indentation can't corrupt it.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'HERE="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]:-$0}")")" && pwd)"'
            printf '%s\n' 'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
            printf '%s\n' '# Frameless GTK window under native Wayland runs headless-invisible'
            printf '%s\n' '# (no surface ever shows); XWayland is the path every tested launch'
            printf '%s\n' '# used. Force it until the Wayland surface path is fixed and proven.'
            printf '%s\n' 'export GDK_BACKEND=x11'
            printf '%s\n' 'exec "$HERE/nightshade_desktop" "$@"'
          } > "$BUNDLE/nightshade"
          chmod +x "$BUNDLE/nightshade"
          ls -l "$BUNDLE_LIB" "$BUNDLE/nightshade"

      # The apply step runs a separate `updater` binary, because the running
      # app holds its own files open and cannot swap them. Windows has
      # shipped one since 6.0; Linux never did, so a Linux build could stage
      # an update and then fail to install it. Built here and bundled so it
      # is inside the archive the manifest hashes.
      - name: Build the updater binary
        run: |
          set -euo pipefail
          cargo build --locked --release --package nightshade_updater \
            --manifest-path native/nightshade_native/Cargo.toml
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          install -m 0755 \
            native/nightshade_native/target/release/updater "$BUNDLE/updater"
          echo "Bundled updater: $(ls -l "$BUNDLE/updater")"

      - name: Verify glibc floor (Bookworm / Raspberry Pi OS compatibility)
        run: |
          set -euo pipefail
          # The SHIPPED appliance runs on Debian/Raspberry Pi OS Bookworm
          # (glibc 2.36) — both the systemd/Pi installs and the docker appliance
          # (FROM debian:bookworm-slim). A binary needing a newer glibc aborts on
          # boot there with "GLIBC_2.38 not found", invisible to a smoke test on
          # this runner. This job builds on ubuntu-22.04 (glibc 2.35, below the
          # floor) so the check passes by construction; the guard stays as a
          # backstop in case the runner image is ever bumped. (The heavier
          # alternative is scripts/docker_build_linux.sh on debian:bookworm-slim,
          # which runs this same gate internally.)
          FLOOR="${NIGHTSHADE_GLIBC_FLOOR:-2.36}"
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          floor_major=${FLOOR%%.*}; floor_minor=${FLOOR#*.}
          violations=0
          for bin in "$BUNDLE"/nightshade_desktop "$BUNDLE"/updater "$BUNDLE"/lib/*.so; do
            [ -f "$bin" ] || continue
            maxv=$(objdump -T "$bin" 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -V | tail -1 || true)
            [ -n "$maxv" ] || continue
            v=${maxv#GLIBC_}; major=${v%%.*}; minor=${v#*.}
            if [ "$major" -gt "$floor_major" ] || \
               { [ "$major" -eq "$floor_major" ] && [ "$minor" -gt "$floor_minor" ]; }; then
              echo "VIOLATION: $(basename "$bin") needs $maxv (> $FLOOR)"
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations binary(ies) exceed glibc $FLOOR — this release would NOT boot on the Bookworm appliance. Build on Bookworm (see comment above)."
            exit 1
          fi
          echo "glibc floor OK (no binary exceeds $FLOOR)"

      - name: Package + checksum
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/build/linux/x64/release/bundle"
          cp LICENSE "$BUNDLE/NIGHTSHADE-LICENSE.txt"
          cp docs/THIRD_PARTY_NOTICES.md "$BUNDLE/THIRD_PARTY_NOTICES.md"
          printf '%s\n' "$GITHUB_SHA" > "$BUNDLE/SOURCE-COMMIT.txt"
          mkdir -p "$BUNDLE/LICENSES"
          cp third_party/licenses/LGPL-2.1.txt "$BUNDLE/LICENSES/LGPL-2.1.txt"
          mkdir -p dist
          tar -czf "dist/nightshade-${APP_VERSION}-linux-x64.tar.gz" \
            -C apps/desktop/build/linux/x64/release \
            --transform "s,^bundle,nightshade-${APP_VERSION}-linux-x64," bundle
          (cd dist && sha256sum "nightshade-${APP_VERSION}-linux-x64.tar.gz" \
             > "nightshade-${APP_VERSION}-linux-x64.tar.gz.sha256")
          ls -l dist

      # The OTA package is a zip rather than the tar.gz above: the updater
      # extracts zips, and teaching it a second archive format to save one
      # asset would be new code on the path that replaces a live install.
      # downloadUrl is baked into the signed manifest, so it must equal the
      # real published asset URL — the immutable per-tag GitHub Releases link
      # (the tag is always v<APP_VERSION>, validated by the version job).
      # Empty NIGHTSHADE_UPDATE_PRIVATE_KEY -> unsigned manifest (OTA stays
      # fail-closed-disabled); the build still succeeds.
      - name: Package + sign OTA manifest
        env:
          NIGHTSHADE_UPDATE_PRIVATE_KEY: ${{ secrets.NIGHTSHADE_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(grep -oP 'build_number:\s*\K\d+' version.yaml)"
          ASSET="nightshade-${APP_VERSION}-linux-x64.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION}/${ASSET}"
          (cd packages/nightshade_updater && dart run tool/build_update_manifest.dart \
            --payload "$GITHUB_WORKSPACE/apps/desktop/build/linux/x64/release/bundle" \
            --out-dir "$GITHUB_WORKSPACE/dist" \
            --version "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform linux \
            --arch x64 \
            --package-name "$ASSET" \
            --download-url "$URL")
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          ls -l dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  windows:
    name: Windows x64
    # Pinned to windows-2022 (not windows-latest): GitHub rolled windows-latest
    # to windows-2025-vs2026 on 2026-06-18, whose newer CMake refuses to extract
    # archives through symlinks and breaks flutter_webrtc's Windows native build
    # ("Cannot extract through symlink ...flutter_webrtc"). windows-2022 is the
    # known-good image used by the previous release. TODO: revisit with a
    # durable fix (pin CMake / flutter_webrtc workaround) before windows-2022 is
    # deprecated.
    runs-on: windows-2022
    timeout-minutes: 60
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      # The imaging crate's build.rs links libraw; point it at the vendored
      # import lib/DLL so the Rust build is self-contained on a clean runner.
      LIBRAW_DIR: ${{ github.workspace }}\lib\libraw
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/nightshade_native

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      # Build phases run as explicit steps (the melos multi-line `run:` only
      # executes its first line on the Windows shell).
      - name: Build Rust native bridge (release)
        run: cargo build --locked --release --manifest-path native/nightshade_native/bridge/Cargo.toml

      # Bake the trusted OTA public key into the binary. Empty secret
      # -> empty define -> runtime OTA stays fail-closed-disabled; the build
      # still succeeds (unsigned beta).
      - name: Build Flutter Windows app (release)
        working-directory: apps/desktop
        run: flutter build windows --release "--dart-define=NIGHTSHADE_UPDATE_PUBLIC_KEY=${{ secrets.NIGHTSHADE_UPDATE_PUBLIC_KEY }}"

      - name: Stage native DLLs (bridge, libraw, MSVC runtime) into Release
        shell: pwsh
        run: ./scripts/stage_windows_release.ps1 -Profile Release

      # OTA needs updater.exe inside the canonical archive. Build + stage it here
      # (before Authenticode) so the signed binary is the one that ships and the
      # one the OTA manifest hashes.
      - name: Build + stage updater.exe
        shell: pwsh
        run: |
          cargo build --locked --release --package nightshade_updater --manifest-path native/nightshade_native/Cargo.toml
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          Copy-Item native/nightshade_native/target/release/updater.exe (Join-Path $rel "updater.exe") -Force
          Write-Host "Staged updater.exe into $rel"

      # Authenticode-sign every binary in the Release tree. No cert secret ->
      # skip (unsigned beta). A SET-but-broken cert throws (fail loud).
      - name: Authenticode sign (optional)
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host "WINDOWS_SIGNING_CERT_BASE64 not set: skipping Authenticode signing (unsigned beta)."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "WINDOWS_SIGNING_CERT_BASE64 is set but signtool.exe was not found under the Windows 10 SDK." }
          $targets = @(Get-ChildItem $rel -Recurse -Include *.exe, *.dll | Select-Object -ExpandProperty FullName)
          if ($targets.Count -eq 0) { throw "No *.exe/*.dll to sign under $rel" }
          $pfx = Join-Path $env:RUNNER_TEMP "nightshade_codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD @targets
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed (exit $LASTEXITCODE)" }
            & $signtool.FullName verify /pa @targets
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed (exit $LASTEXITCODE)" }
            Write-Host "Authenticode-signed $($targets.Count) file(s)."
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Verify the Release output is complete
        shell: pwsh
        run: |
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          $missing = @()
          # 6.0 ships OTA auto-update, so updater.exe is now REQUIRED (it was
          # forbidden under 5.0's manual-update-only policy).
          foreach ($f in @("nightshade_desktop.exe", "nightshade_bridge.dll", "libraw.dll", "updater.exe")) {
            if (-not (Test-Path (Join-Path $rel $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Release dir contents:"
            Get-ChildItem $rel | Format-Table Name, Length
            Write-Error "Missing required files in Release output: $($missing -join ', ')"
            exit 1
          }
          # Vendor SDK DLLs stay forbidden: the release zip redistributes none.
          $forbidden = @(
            "ASICamera2.dll", "EAF_focuser.dll", "EFW_filter.dll",
            "qhyccd.dll", "AtikCameras.dll", "PlayerOneCamera.dll",
            "SVBCameraSDK.dll", "ogmacam.dll", "dlapi.dll"
          )
          $unexpected = @($forbidden | Where-Object { Test-Path (Join-Path $rel $_) })
          if ($unexpected.Count -gt 0) {
            Write-Error "Release redistributes no vendor SDKs; unexpected files: $($unexpected -join ', ')"
            exit 1
          }
          Write-Host "Release output verified:"
          Get-ChildItem $rel | Format-Table Name, Length

      # Stage the license/source files into Release, then let
      # build_update_package.ps1 produce the ONE canonical zip + the signed OTA
      # manifest that describes it (single archive => packageSha256 + files map
      # all agree). downloadUrl is baked + signed into the manifest, so it must
      # equal the real published asset URL: the immutable per-tag GitHub Releases
      # download URL (the tag is always v<APP_VERSION>, validated by the version
      # job). Empty NIGHTSHADE_UPDATE_PRIVATE_KEY -> unsigned manifest (OTA stays
      # fail-closed-disabled); the build still succeeds.
      - name: Package + sign OTA manifest
        shell: pwsh
        env:
          NIGHTSHADE_UPDATE_PRIVATE_KEY: ${{ secrets.NIGHTSHADE_UPDATE_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = "apps/desktop/build/windows/x64/runner/Release"
          Copy-Item LICENSE (Join-Path $rel "NIGHTSHADE-LICENSE.txt") -Force
          Copy-Item docs/THIRD_PARTY_NOTICES.md (Join-Path $rel "THIRD_PARTY_NOTICES.md") -Force
          $env:GITHUB_SHA | Out-File -Encoding ascii (Join-Path $rel "SOURCE-COMMIT.txt")
          New-Item -ItemType Directory -Force -Path (Join-Path $rel "LICENSES") | Out-Null
          Copy-Item third_party/licenses/LGPL-2.1.txt (Join-Path $rel "LICENSES/LGPL-2.1.txt") -Force
          $name = "nightshade-$($env:APP_VERSION)-windows-x64.zip"
          $url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/v$($env:APP_VERSION)/$name"
          ./scripts/build_update_package.ps1 -SkipBuild -SkipUpdaterBuild -NoPusherCopy `
            -OutputDir dist -DownloadUrl $url
          $zip = "dist/$name"
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $name" `
            | Out-File -Encoding ascii "$zip.sha256"
          # Per-target name. The publish job copies every platform's artifacts
          # into one flat directory, so three jobs each emitting `manifest.json`
          # would leave whichever copied last standing and the other two
          # platforms undiscoverable. The filename is not part of the signed
          # payload, so renaming does not disturb the signature.
          Move-Item "dist/manifest.json" "dist/manifest-windows-x64.json" -Force
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  publish:
    name: Attach / publish GitHub Release
    needs: [version, android, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    env:
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # manifest-<platform>-<arch>.json: one per target, so every platform's
          # manifest survives the flattening into release-assets/. The bare
          # manifest.json pattern stays for any artifact built before the
          # per-target rename.
          find artifacts -type f \( -name '*.apk' -o -name '*.tar.gz' \
            -o -name '*.zip' -o -name '*.sha256' \
            -o -name 'manifest.json' -o -name 'manifest-*.json' \) \
            -exec cp -v {} release-assets/ \;
          # A manifest whose name collided would silently leave a platform
          # unable to find its update, so prove each landed exactly once.
          dupes="$(find artifacts -type f -name 'manifest*.json' -printf '%f\n' \
            | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Two build jobs produced the same manifest filename; one overwrote the other: $dupes"
            exit 1
          fi
          cp LICENSE release-assets/NIGHTSHADE-LICENSE.txt
          cp docs/THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cp third_party/licenses/LGPL-2.1.txt release-assets/LGPL-2.1.txt
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE-COMMIT.txt
          echo "Release assets:"
          ls -l release-assets

      # Fail early with a clear message rather than letting the publish step
      # silently fall back to an empty release body when the notes file for this
      # tag was never written. The file name must match the tag (v5.0.0 ->
      # docs/release/v5.0.0.md).
      - name: Verify release notes exist for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          notes="docs/release/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes file '$notes' is missing. Create it before tagging, or the published release would have an empty body."
            exit 1
          fi
          echo "Found release notes: $notes"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Nightshade ${{ env.RELEASE_TAG }}
          body_path: docs/release/${{ env.RELEASE_TAG }}.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - name: Attach artifacts to existing draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
