# Codecov configuration for Skotiq 2.0.
#
# Coverage may not drop silently. This file enforces:
#   - at most a 1% coverage drop per PR (threshold)
#   - target tracks the parent commit (target: auto)
#   - patch coverage on new lines reaches 60%
#
# Docs: https://docs.codecov.com/docs/codecovyml-reference

codecov:
  # Don't post duplicate status checks while CI is still running.
  notify:
    after_n_builds: 1
    wait_for_ci: true

coverage:
  # Two decimal places in the rendered percentages.
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        # Compare against the parent commit's coverage.
        target: auto
        # Allow at most a 1% drop before failing the status check.
        threshold: 1%
        # Coverage uploads from forks may be missing — don't gate forks.
        if_not_found: success
        # Drops are a PR-visible failure, not an advisory note.
        informational: false

    patch:
      default:
        # New code introduced in the PR reaches 60% line coverage. The floor
        # sits above the codebase average so that tests are rewarded without
        # blocking PRs in low-coverage packages.
        target: 60%
        threshold: 5%
        if_not_found: success
        informational: false

# Generated code is not measured; it skews the percentages.
ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*.gr.dart"
  - "**/*.config.dart"
  - "**/*.drift.dart"
  - "**/*.mocks.dart"
  - "**/frb_generated*.dart"
  - "**/frb_generated*.rs"
  - "**/bridge_generated.h"
  - "packages/skotiq_bridge/lib/src/api/**"
  - "native/skotiq_native/bridge/src/frb_generated*.rs"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
