name: Bug report
description: Something broke during imaging, setup, or remote control
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Skotiq during the beta. The fields below map to what maintainers need most often.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - iOS
        - Android
        - Web dashboard (browser)
        - Headless server only
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Skotiq version
      description: Help → About, asset filename, or release tag (e.g. 4.1.0)
      placeholder: "4.1.0"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Driver backend (if equipment-related)
      options:
        - Not equipment-related
        - ASCOM COM
        - ASCOM Alpaca
        - INDI
        - Native SDK
        - Simulator
        - PHD2
        - Multiple / unsure
    validations:
      required: true

  - type: textarea
    id: devices
    attributes:
      label: Equipment involved
      description: Camera, mount, focuser, filter wheel, etc. Include vendor/model when known.
      placeholder: "ZWO ASI2600MC Pro, SkyWatcher EQ6-R, Alpaca focuser at 192.168.1.50:11111"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did right before the failure. Include sequence step or screen if relevant.
      placeholder: |
        1. Connected camera via native SDK
        2. Started 300s exposure in sequencer
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      description: Paste relevant log lines or the on-screen error. Redact paths/IPs if you prefer.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I can reproduce this on the latest beta release (or noted why not)
          required: false
