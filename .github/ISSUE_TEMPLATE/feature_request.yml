name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For large features, maintainers prefer a short design discussion in the issue before a PR. See [CONTRIBUTING.md](../CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is painful or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you expect Skotiq to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other apps, scripts, or workarounds you have tried
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sequencer / automation
        - Imaging / camera
        - Mount / slewing
        - Guiding / PHD2
        - Plate solving / framing
        - Plan Tonight / scheduler
        - Remote / mobile / web dashboard
        - Planetarium
        - UI / UX
        - Drivers / hardware
        - Other
    validations:
      required: true
