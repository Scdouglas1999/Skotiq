# Which files count as production code is defined once, in audit-scope.yaml
# (runtime.include). This file adds the analyzer-only excludes and thresholds.
production:
  exclude:
    - '**/.dart_tool/**'
    - '**/.git/**'
    - '**/build/**'
    - '**/coverage/**'
    - '**/test/**'
    - '**/tests/**'
    - '**/*.g.dart'
    - '**/frb_generated*.dart'
thresholds:
  errors: 0
  warnings: 0
  infos: 999999
