name: skotiq_remote_protocol
description: Skotiq remote-control protocol — LAN discovery, pairing, and secure token management.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  http2: ^2.3.0
  crypto: ^3.0.3
  drift: ^2.30.0
  path_provider: ^2.1.2
  path: ^1.8.3
  nsd: ^3.0.0
  # v4 couch-grade remote: the self-hostable relay tunnel. Pure-Dart package
  # under tools/ (outside the melos workspace globs), so it is referenced by
  # an explicit path dependency. Re-exported below so the desktop headless
  # bootstrap and the mobile transport consume RelayUplink / RelayTunnelClient
  # without each depending on tools/ directly.
  skotiq_relay:
    path: ../../tools/skotiq_relay

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  flutter_lints: ^5.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.4.15
  mocktail: ^1.0.4
