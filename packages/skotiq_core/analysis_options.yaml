# Inherits from the workspace-root analysis_options.yaml which configures
# flutter_lints 5.x rule overrides.
include: ../../analysis_options.yaml

analyzer:
  # Generated code (Drift DAOs *.g.dart, freezed *.freezed.dart) is also
  # excluded at workspace-root; pinning it again here keeps the rules below
  # from reaching regenerated DAOs and freezed unions.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

# The workspace-root config disables these two rules globally;
# skotiq_core enables them here, with generated paths excluded above.
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
