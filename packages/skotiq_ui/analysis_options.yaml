# Inherits from the workspace-root analysis_options.yaml which configures
# flutter_lints 5.x rule overrides.
include: ../../analysis_options.yaml

# The workspace-root config disables prefer_const_constructors and
# prefer_const_literals_to_create_immutables globally; skotiq_ui enables
# them here. Packages without their own override inherit the disabled state.
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
