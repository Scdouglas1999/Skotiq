name: skotiq_ui
description: Skotiq UI Design System - Shared components and theming
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  skotiq_design:
    path: ../skotiq_design
  flutter:
    sdk: flutter
  lucide_icons: ^0.257.0
  skotiq_core:
    path: ../skotiq_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned exact version across all 10 workspace packages to prevent
  # mixed-version drift.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Bundled variable fonts (offline-safe — no runtime fetch). Flutter maps
  # TextStyle.fontWeight onto the `wght` axis of each variable font, so a
  # single file covers every weight we use.
  #   HankenGrotesk  — primary UI typeface (Thin…Black). Chosen for a clean,
  #                    quiet grotesque that reads as a precision instrument
  #                    without the generic Inter "template" look.
  #   SplineSansMono — technical/telemetry numerics (Light…Bold).
  # Licenses ship alongside the .ttf files (OFL requires distribution).
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-VF.ttf
    - family: SplineSansMono
      fonts:
        - asset: assets/fonts/SplineSansMono-VF.ttf
    #   Sora — the wordmark face only ("skotiq", SemiBold). Chosen for the
    #            rebrand; nothing else should set it.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-VF.ttf




