# Inherits from the workspace-root analysis_options.yaml which configures
# flutter_lints 5.x rule overrides. Bridge-specific strict modes preserved.
include: ../../analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # FRB output (api.dart, lib/src/api/**, frb_generated*) is regenerated
  # wholesale by `flutter_rust_bridge_codegen generate`, which wipes any
  # hand-edited `const` annotation. Those paths stay out of analysis so the
  # rules below apply only to the hand-written portion of lib/.
  exclude:
    - "**/frb_generated*.dart"
    - "**/api.dart"
    - "**/api/**"

# The workspace-root config disables these two rules globally;
# skotiq_bridge enables them here, with the generator-output paths
# excluded above so the rules cannot fight regenerated code.
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
