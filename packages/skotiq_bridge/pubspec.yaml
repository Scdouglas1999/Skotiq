name: skotiq_bridge
description: Skotiq Bridge - Dart FFI bindings to Rust native code
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.11.1
  freezed_annotation: ^3.0.0
  http: ^1.2.0
  path_provider: ^2.1.2
  path: ^1.8.3
  win32: ^5.0.0  # For native Windows ASCOM support via COM

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  # Noisy rules (override_on_non_overriding_member, super_formal_parameter_*,
  # use_string_in_part_of_directives, deprecated_member_use_from_same_package)
  # are disabled at the workspace-root analysis_options.yaml.
  flutter_lints: ^5.0.0
  ffigen: ^11.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.0
