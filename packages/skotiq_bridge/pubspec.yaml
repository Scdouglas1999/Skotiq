name: skotiq_bridge
description: Skotiq Bridge - Dart FFI bindings to Rust native code
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  # Records reach the app log through core's forwarder (Log).
  logging: ^1.3.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.11.1 # must equal the bridge crate's =2.11.1 (native/skotiq_native/bridge/Cargo.toml)
  freezed_annotation: ^3.0.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned across all 10 workspace packages to prevent mixed-version drift.
  # Noisy rules (override_on_non_overriding_member, super_formal_parameter_*,
  # use_string_in_part_of_directives, deprecated_member_use_from_same_package)
  # are disabled at the workspace-root analysis_options.yaml.
  flutter_lints: ^5.0.0
  ffigen: ^11.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.0
