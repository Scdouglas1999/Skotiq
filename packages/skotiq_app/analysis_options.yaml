# Inherits from the workspace-root analysis_options.yaml which configures
# flutter_lints 5.x rule overrides. Package-specific tweaks (if any) go below.
include: ../../analysis_options.yaml

# The workspace-root config disables both const rules globally; this package
# opts back in. skotiq_app carries no generated code (no *.g.dart or
# *.freezed.dart under lib/), so the workspace-root analyzer.exclude block
# already covers everything these rules must not touch.
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
