# Test configuration for the skotiq_app package.

tags:
  # Pixel-diff / capture golden tests (`matchesGoldenFile`) whose baselines are
  # host-specific: the GPU rasteriser and font hinting differ across OSes, so a
  # baseline captured on one host produces ~1-1.5% diffs on another and the
  # default golden comparator fails. These are EXCLUDED from `melos run test`
  # (Linux CI + default local runs) via `--exclude-tags golden` and run opt-in
  # via `melos run test:golden`. Registered here so `dart test` recognises the
  # tag (an undeclared tag is itself an error); not hard-skipped in config so
  # the opt-in command can still select it.
  # See docs/testing/golden-tests.md.
  golden:
